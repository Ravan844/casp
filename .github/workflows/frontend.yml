name: Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build frontend
        run: |
          cd apps/frontend
          npm install
          npm run build

      - name: Deploy frontend with Ansible
        run: |
          ansible-playbook \
            -i /home/azureuser/casp/config/ansible/inventories/dev/hosts.yml \
            /home/azureuser/casp/config/ansible/playbooks/deploy-frontend.yml \
            --extra-vars "artifact_path=${GITHUB_WORKSPACE}/apps/frontend/dist"
